<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b1324">
<title>[TV] Telão • Confra & Play</title>
<style>
:root{
  --bg:#0b1324; --bg2:#111c33; --card:#15213b; --card2:#101a31; --linha:#27365a;
  --txt:#f1f5f9; --mut:#94a3b8; --laranja:#f26522; --ouro:#fbbf24; --prata:#cbd5e1; --verde:#34d399; --verm:#f87171;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#050a14;color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
body.sem-cursor{cursor:none}
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:center center;overflow:hidden;
  background:radial-gradient(1200px 700px at 15% -10%,#1b2d57 0%,transparent 60%),radial-gradient(1000px 600px at 100% 110%,#3a1d10 0%,transparent 55%),linear-gradient(180deg,var(--bg2),var(--bg))}

/* ===== topo ===== */
#topo{position:absolute;left:0;top:0;width:1920px;height:96px;padding:0 40px;display:flex;align-items:center;grid-gap:28px;border-bottom:1px solid var(--linha);background:rgba(8,14,28,.55);z-index:5}
.logo{display:flex;align-items:center;grid-gap:14px;font-weight:900;letter-spacing:.04em;font-size:28px;white-space:nowrap}
.logo .bola{font-size:40px}
.logo b{color:var(--laranja)}
#tnome{flex:1;min-width:0;text-align:center}
#tnome h1{font-size:38px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#tnome small{display:block;font-size:19px;color:var(--mut);margin-top:2px;white-space:nowrap}
#direita{display:flex;align-items:center;grid-gap:20px;white-space:nowrap}
#fase{font-size:22px;font-weight:800;letter-spacing:.08em;padding:10px 22px;border-radius:999px;background:rgba(242,101,34,.16);border:1px solid rgba(242,101,34,.55);color:#ffb48a}
#relogio{font-size:30px;font-weight:700;color:var(--mut);font-variant-numeric:tabular-nums}
#vivo{display:flex;align-items:center;grid-gap:8px;font-size:18px;font-weight:800;color:var(--verde);letter-spacing:.06em}
#vivo i{width:12px;height:12px;border-radius:50%;background:var(--verde);box-shadow:0 0 0 0 rgba(52,211,153,.7);animation:pulso 1.8s infinite}
#vivo.off{color:var(--verm)} #vivo.off i{background:var(--verm);animation:none}
@keyframes pulso{70%{box-shadow:0 0 0 12px rgba(52,211,153,0)}100%{box-shadow:0 0 0 0 rgba(52,211,153,0)}}

/* ===== palco ===== */
#palco{position:absolute;left:0;top:104px;width:1920px;height:872px;padding:20px 24px;overflow:hidden}
.fade{animation:fadeIn .6s ease both}
@keyframes fadeIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.ptitulo{height:84px;display:flex;align-items:center;justify-content:center;grid-gap:24px}
.ptitulo h2{font-size:52px;font-weight:900;letter-spacing:.06em;text-transform:uppercase}
.ptitulo .cont{font-size:46px;font-weight:900;background:var(--laranja);color:#fff;min-width:84px;text-align:center;padding:2px 22px;border-radius:16px}
.ptitulo .pg{font-size:22px;color:var(--mut);font-weight:700}
.grid{display:grid;justify-content:center;align-content:center}
.cell{position:relative}
.cell>.in{position:absolute;left:50%;top:50%;transform-origin:center center}
.vazio-msg{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;grid-gap:18px;color:var(--mut);font-size:44px;font-weight:700}
.vazio-msg .ic{font-size:120px}

/* nomes */
.p1{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700}
.p2{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500;color:#cbd5e1}
.tbd{color:#64748b;font-style:italic;font-weight:500}
.amp{font-style:normal;color:#64748b;margin:0 .15em}
.sd{font-style:normal;font-size:.62em;font-weight:900;padding:.1em .4em;border-radius:6px;margin-left:.45em;vertical-align:middle}
.sd.s1{background:#fef3c7;color:#b45309}.sd.s2{background:#e2e8f0;color:#334155}

/* inscritos */
.icard{width:380px;display:flex;align-items:center;grid-gap:16px;padding:0 18px;background:linear-gradient(180deg,var(--card),var(--card2));border:1px solid var(--linha);border-radius:16px;font-size:26px}
.icard .n{font-size:20px;font-weight:900;color:var(--laranja);min-width:34px}
.icard .nm{flex:1;min-width:0}
.icard.novo{animation:popNovo 1.4s ease both}
@keyframes popNovo{0%{transform:scale(.4);opacity:0;box-shadow:0 0 0 0 rgba(242,101,34,.9)}40%{transform:scale(1.12);opacity:1;box-shadow:0 0 40px 10px rgba(242,101,34,.55)}100%{transform:scale(1);box-shadow:none}}

/* grupos */
.gcard{width:600px;display:flex;flex-direction:column;background:linear-gradient(180deg,var(--card),var(--card2));border:1px solid var(--linha);border-radius:22px;overflow:hidden}
.gcard.flash{animation:flashG 2.2s ease}
@keyframes flashG{0%,100%{border-color:var(--linha);box-shadow:none}15%,60%{border-color:var(--laranja);box-shadow:0 0 36px 4px rgba(242,101,34,.55)}}
.gh{height:70px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 24px;background:linear-gradient(90deg,#f26522,#d95316);font-weight:900;letter-spacing:.06em}
.gh b{font-size:32px}.gh span{font-size:20px;font-weight:700;opacity:.92}
.gh .qd{opacity:1;background:#fff;color:#4338ca;font-size:21px;font-weight:900;padding:4px 16px;border-radius:999px;letter-spacing:.04em;box-shadow:0 2px 10px rgba(0,0,0,.35)}
.gcols,.glin{display:grid;grid-template-columns:50px 1fr 56px 56px 62px 72px;align-items:center;padding:0 18px;grid-gap:4px}
.gcols{height:38px;flex:none;font-size:17px;font-weight:800;color:var(--mut);letter-spacing:.08em;border-bottom:1px solid var(--linha)}
.gcols span,.glin .c{text-align:center}
.gcols span:nth-child(2){text-align:left}
.glin{flex:none;border-bottom:1px solid rgba(255,255,255,.05);font-size:25px}
.glin:last-child{border-bottom:0}
.glin .pos{font-weight:900;font-size:22px;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#1e2d4d;color:#cbd5e1}
.glin.q-ouro .pos{background:var(--ouro);color:#3b2a00}
.glin.q-prata .pos{background:var(--prata);color:#1e293b}
.glin.q-ok .pos{background:var(--verde);color:#063b2a}
.glin .nm{min-width:0}
.glin .c{font-size:25px;color:#cbd5e1;font-variant-numeric:tabular-nums}
.glin .c.v{font-weight:900;color:#fff}
.glin .c.pos-sg{color:var(--verde)}.glin .c.neg-sg{color:var(--verm)}
.fant{display:block;height:.9em;width:70%;border-radius:8px;background:linear-gradient(90deg,#1e2d4d,#2a3d66,#1e2d4d);background-size:200% 100%;animation:shimmer 1.4s linear infinite}
@keyframes shimmer{to{background-position:-200% 0}}
.preenche{animation:preenche .7s ease both}
@keyframes preenche{0%{opacity:0;transform:scale(.7);filter:brightness(3)}60%{opacity:1;transform:scale(1.08)}100%{transform:none;filter:none}}
.legenda{position:absolute;right:30px;bottom:6px;font-size:17px;color:var(--mut);display:flex;grid-gap:18px;align-items:center}
.legenda i{display:inline-block;width:14px;height:14px;border-radius:50%;margin-right:6px;vertical-align:-2px}

/* chave */
.bloco{position:relative;margin:0 auto}
.bnr{height:36px;display:flex;align-items:center;grid-gap:16px;font-size:24px;font-weight:900;letter-spacing:.08em}
.bnr.ouro{color:var(--ouro)}.bnr.prata{color:var(--prata)}
.bnr .camp{font-size:20px;font-weight:700;letter-spacing:0;color:#fff;background:rgba(251,191,36,.18);border:1px solid rgba(251,191,36,.5);padding:2px 16px;border-radius:999px}
.bnr.prata .camp{background:rgba(203,213,225,.15);border-color:rgba(203,213,225,.5)}
.rt{position:absolute;top:36px;height:46px;text-align:center;font-size:21px;font-weight:800;letter-spacing:.1em;color:var(--mut);text-transform:uppercase;line-height:46px}
.rt.fin{color:var(--ouro)}
.mc{position:absolute;display:flex;flex-direction:column;background:linear-gradient(180deg,var(--card),var(--card2));border:1px solid var(--linha);border-radius:12px;overflow:hidden;font-size:var(--fs,20px)}
.mc .tr{flex:1;min-height:0;display:flex;align-items:center;grid-gap:8px;padding:0 10px;border-left:5px solid transparent}
.mc .tr+.tr{border-top:1px solid rgba(255,255,255,.07)}
.mc .nm{flex:1;min-width:0;line-height:1.12}
.mc.inline .p1{font-weight:700}
.mc .sc{display:flex;grid-gap:4px}
.mc .sc b{min-width:1.7em;text-align:center;font-size:1.02em;color:#94a3b8;background:rgba(255,255,255,.06);border-radius:6px;padding:.1em 0}
.mc .tr.win{background:linear-gradient(90deg,rgba(251,191,36,.18),rgba(251,191,36,.03));border-left-color:var(--ouro)}
.mc .tr.win .nm{color:#fff}.mc .tr.win .sc b{color:#fff;background:rgba(251,191,36,.28)}
.mc .tr.lose{opacity:.55}
.mc .tr.novo{animation:novoSlot 2.2s ease}
@keyframes novoSlot{0%,100%{background:transparent}20%,60%{background:rgba(242,101,34,.4)}}
.mc .wo{font-size:.78em;font-weight:900;color:#fca5a5;letter-spacing:.06em}
.mc .quadra{position:absolute;right:8px;top:-1px;font-size:.62em;font-weight:900;background:#4338ca;color:#fff;padding:.12em .7em;border-radius:0 0 8px 8px;letter-spacing:.05em}
.mc.later{opacity:0;transition:opacity .9s ease}.rvshow .mc.later{opacity:1}
svg.conn{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}
svg.conn path{fill:none;stroke:#34466e;stroke-width:3}
svg.conn path.on{stroke:var(--ouro);stroke-width:4}
.bloco.rv svg.conn{opacity:0}.bloco.rv.rvshow svg.conn{opacity:1;transition:opacity .4s}
.bloco.rv.rvshow svg.conn path{stroke-dasharray:var(--len,600);stroke-dashoffset:var(--len,600);animation:desenha 1.2s ease forwards}
@keyframes desenha{to{stroke-dashoffset:0}}
.girando .p1,.girando .p2{color:var(--laranja)}
.trava{animation:trava .6s ease}
@keyframes trava{0%{transform:scale(1.25);color:#fff;text-shadow:0 0 18px var(--laranja)}100%{transform:none}}

/* sino 6x0 */
#overlay.sino{background:radial-gradient(900px 620px at 50% 38%,rgba(51,65,85,.985),rgba(5,10,20,.985) 72%)}
.sino-bell{font-size:230px;line-height:1;margin-bottom:34px;transform-origin:50% 8%;animation:sinoBalanca .9s ease-in-out infinite;filter:drop-shadow(0 0 40px rgba(251,191,36,.55))}
@keyframes sinoBalanca{0%,100%{transform:rotate(-26deg)}50%{transform:rotate(26deg)}}
#overlay .st{font-size:40px;font-weight:900;letter-spacing:.22em;color:#e2e8f0;margin-top:2px}
#overlay .sp{font-size:120px;font-weight:900;line-height:1;margin-top:6px;color:#fff;text-shadow:0 0 40px rgba(148,163,184,.7);animation:pneu 1.6s ease-in-out infinite}
@keyframes pneu{50%{transform:scale(1.08)}}
#overlay .sn{font-size:84px;font-weight:900;line-height:1.12;margin-top:22px}
#overlay .sn div+div{margin-top:2px}
#overlay .sv{font-size:30px;color:#cbd5e1;margin-top:34px}
/* sorteio */
#reel{position:absolute;left:50%;top:122px;transform:translateX(-50%);width:880px;padding:26px 40px;text-align:center;background:linear-gradient(180deg,#1d2f57,#101a31);border:2px solid var(--laranja);border-radius:26px;box-shadow:0 0 60px rgba(242,101,34,.35);z-index:6}
#reel .t{font-size:20px;font-weight:800;letter-spacing:.2em;color:var(--laranja)}
#reel .n{font-size:52px;font-weight:900;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#reel .d{font-size:26px;font-weight:800;color:var(--ouro);margin-top:4px;min-height:34px}
#reel.lock .n{animation:trava .6s ease}
.voo{position:absolute;left:0;top:0;z-index:7;font-size:30px;font-weight:900;white-space:nowrap;padding:12px 26px;background:var(--laranja);color:#fff;border-radius:14px;box-shadow:0 10px 40px rgba(242,101,34,.7);transform-origin:top left;pointer-events:none}

/* faixa de resultado */
#faixa{position:absolute;left:24px;right:24px;bottom:14px;height:64px;display:flex;align-items:center;grid-gap:22px;padding:0 28px;border-radius:18px;background:rgba(8,14,28,.82);border:1px solid var(--linha);font-size:27px;white-space:nowrap;overflow:hidden;z-index:4}
#faixa.hide{visibility:hidden}
#faixa .rot{font-size:18px;font-weight:900;letter-spacing:.1em;color:var(--laranja);text-transform:uppercase}
#faixa .tx{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
#faixa .w{font-weight:900;color:#fff}
#faixa .l{color:var(--mut)}
#faixa .pl{font-weight:900;color:var(--ouro);margin:0 .5em}
#faixa.novo{animation:faixaNovo 3s ease}
@keyframes faixaNovo{0%,100%{border-color:var(--linha);box-shadow:none}10%,70%{border-color:var(--laranja);box-shadow:0 0 40px rgba(242,101,34,.6)}}

/* campeão */
#overlay{position:absolute;top:0;right:0;bottom:0;left:0;z-index:20;display:none;align-items:center;justify-content:center;flex-direction:column;text-align:center;background:radial-gradient(900px 600px at 50% 40%,rgba(84,62,8,.975),rgba(5,10,20,.975) 72%)}
#overlay.on{display:flex;animation:fadeOv .8s ease both}
@keyframes fadeOv{from{opacity:0}to{opacity:1}}
#overlay .tf{font-size:220px;line-height:1;animation:balanca 2.4s ease-in-out infinite;filter:drop-shadow(0 0 50px rgba(251,191,36,.8))}
@keyframes balanca{50%{transform:translateY(-18px) rotate(3deg) scale(1.04)}}
#overlay .ct{font-size:44px;font-weight:900;letter-spacing:.2em;color:var(--ouro);margin-top:6px}
#overlay .cn{font-size:92px;font-weight:900;line-height:1.1;margin-top:24px;text-shadow:0 0 40px rgba(251,191,36,.55)}
#overlay .cn div+div{margin-top:4px}
#overlay .cv{font-size:34px;color:#cbd5e1;margin-top:40px}
#confete{position:absolute;top:0;right:0;bottom:0;left:0;z-index:21;pointer-events:none}

/* estados */
#splash{position:absolute;top:0;right:0;bottom:0;left:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;grid-gap:26px;background:var(--bg);font-size:44px;font-weight:800;text-align:center;padding:0 120px}
#splash .bola{font-size:140px;animation:quica 1s ease-in-out infinite}
@keyframes quica{50%{transform:translateY(-40px)}}
#splash small{font-size:26px;color:var(--mut);font-weight:500}
.pick{display:grid;grid-template-columns:repeat(2,1fr);grid-gap:26px;width:1500px}
.pick a{display:block;text-decoration:none;color:var(--txt);background:linear-gradient(180deg,var(--card),var(--card2));border:2px solid var(--linha);border-radius:22px;padding:26px 34px;text-align:left}
.pick a:focus,.pick a:hover{outline:none;border-color:var(--laranja);box-shadow:0 0 40px rgba(242,101,34,.4)}
.pick h3{font-size:36px;margin-bottom:6px}.pick p{font-size:22px;color:var(--mut);font-weight:500}
.pick .st{display:inline-block;font-size:18px;font-weight:900;letter-spacing:.08em;padding:4px 14px;border-radius:999px;margin-bottom:10px;background:rgba(52,211,153,.18);color:var(--verde)}
.pick .st.enc{background:rgba(148,163,184,.18);color:var(--mut)}
#dica{position:fixed;left:50%;top:110px;transform:translateX(-50%);z-index:50;font-size:15px;color:#cbd5e1;background:rgba(0,0,0,.7);padding:8px 18px;border-radius:999px;transition:opacity .8s;pointer-events:none}
@media (prefers-reduced-motion:reduce){.fade,.icard.novo,.preenche{animation:none}}

/* gap de flex emulado */
/* ===== topo ===== */
#topo>*+*{margin-left:28px}
.logo>*+*{margin-left:14px}
#direita>*+*{margin-left:20px}
#vivo>*+*{margin-left:8px}
.ptitulo>*+*{margin-left:24px}
.vazio-msg>*+*{margin-top:18px}
/* inscritos */
.icard>*+*{margin-left:16px}
.legenda>*+*{margin-left:18px}
.bnr>*+*{margin-left:16px}
.mc .tr>*+*{margin-left:8px}
.mc .sc>*+*{margin-left:4px}
/* faixa de resultado */
#faixa>*+*{margin-left:22px}
/* estados */
#splash>*+*{margin-top:26px}

/* navegadores sem CSS Grid (Chrome < 57): troca grid por flex */
@supports not (display:grid){
  .grid{display:flex;flex-wrap:wrap;justify-content:center;align-content:center}
  .grid{width:calc(100% + var(--g));height:calc(100% + var(--g)) !important;margin:0 calc(var(--g) * -1) calc(var(--g) * -1) 0}
  .grid>*{flex:none;margin:0 var(--g) var(--g) 0}
  .gcols,.glin{display:flex;align-items:center}
  .gcols>*,.glin>*{flex:none;margin-left:4px}
  .gcols>*:nth-child(1),.glin>*:nth-child(1){width:50px;margin-left:0}
  .gcols>*:nth-child(2),.glin>*:nth-child(2){flex:1 1 0px;width:auto;min-width:0}
  .gcols>*:nth-child(3),.glin>*:nth-child(3){width:56px}
  .gcols>*:nth-child(4),.glin>*:nth-child(4){width:56px}
  .gcols>*:nth-child(5),.glin>*:nth-child(5){width:62px}
  .gcols>*:nth-child(6),.glin>*:nth-child(6){width:72px}
  .pick{display:flex;flex-wrap:wrap;width:1500px}
  .pick>*{width:737px;margin:13px}
}</style>

<body>
<div id="stage">
  <header id="topo">
    <div class="logo"><span class="bola">🎾</span><span>CONFRA <b>&amp;</b> PLAY</span></div>
    <div id="tnome"><h1>—</h1><small></small></div>
    <div id="direita"><div id="fase"></div><div id="vivo"><i></i><span>AO VIVO</span></div><div id="relogio">--:--</div></div>
  </header>
  <main id="palco"></main>
  <div id="reel" style="display:none"></div>
  <div id="faixa" class="hide"></div>
  <div id="overlay"></div>
  <canvas id="confete" width="1920" height="1080"></canvas>
  <div id="splash"><div class="bola">🎾</div><div id="splashTxt">Conectando…</div></div>
</div>
<div id="dica">Clique para tela cheia • F = tela cheia • Espaço = pular animação • Esc = trocar campeonato</div>
    <script>
    /* Diagnóstico para navegadores de TV: mostra erros na tela em vez de ficar parado em "Carregando..." */
    (function () {
        function banner(txt) {
            try {
                var b = document.getElementById('diagErro');
                if (!b) {
                    b = document.createElement('div'); b.id = 'diagErro';
                    b.style.cssText = 'position:fixed;left:0;right:0;bottom:0;z-index:2147483647;background:#7f1d1d;color:#fff;font:14px/1.4 sans-serif;padding:10px 14px;white-space:pre-wrap;word-break:break-word';
                    (document.body || document.documentElement).appendChild(b);
                }
                b.textContent = txt;
            } catch (e) {}
        }
        window.addEventListener('error', function (e) { banner('⚠️ Erro no navegador: ' + (e.message || 'desconhecido') + (e.lineno ? ' (linha ' + e.lineno + ')' : '') + '\nNavegador: ' + navigator.userAgent); });
        window.addEventListener('unhandledrejection', function (e) { var r = e.reason; banner('⚠️ Falha ao carregar: ' + ((r && r.message) || r) + '\nNavegador: ' + navigator.userAgent); });
        window.__diagBanner = banner;
    })();
    </script>

<script>
(function(){
  var P=Array.prototype,S=String.prototype,O=Object;
  if(!O.assign)O.assign=function(t){for(var i=1;i<arguments.length;i++){var s=arguments[i];if(s)for(var k in s)if(O.prototype.hasOwnProperty.call(s,k))t[k]=s[k];}return t;};
  if(!O.entries)O.entries=function(o){return O.keys(o).map(function(k){return[k,o[k]];});};
  if(!O.values)O.values=function(o){return O.keys(o).map(function(k){return o[k];});};
  if(!P.includes)P.includes=function(x){return this.indexOf(x)>=0;};
  if(!P.find)P.find=function(f){for(var i=0;i<this.length;i++)if(f(this[i],i,this))return this[i];};
  if(!P.findIndex)P.findIndex=function(f){for(var i=0;i<this.length;i++)if(f(this[i],i,this))return i;return -1;};
  if(!P.fill)P.fill=function(v){for(var i=0;i<this.length;i++)this[i]=v;return this;};
  if(!Array.from)Array.from=function(a,f){var r=[],n=a.length>>>0,i;if(a.length==null&&a.forEach){a.forEach(function(x){r.push(x);});}else for(i=0;i<n;i++)r.push(a[i]);return f?r.map(f):r;};
